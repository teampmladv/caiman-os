# /etc/nginx/sites-available/caimanos.com
# Production config for caimanos.com
# Requires: certbot --nginx -d caimanos.com -d www.caimanos.com

server {
    listen 80;
    server_name caimanos.com www.caimanos.com;
    return 301 https://caimanos.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.caimanos.com;
    ssl_certificate     /etc/letsencrypt/live/caimanos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caimanos.com/privkey.pem;
    return 301 https://caimanos.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name caimanos.com;

    ssl_certificate     /etc/letsencrypt/live/caimanos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caimanos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Landing page
    root /opt/caiman/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Install script
    location = /install.sh {
        alias /opt/caiman/caiman-os/install/scripts/install.sh;
        add_header Content-Type text/plain;
        add_header Content-Disposition inline;
    }

    # Proxy /api/* to caiman-api
    location /api/ {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Rate limiting for demo (prevent abuse)
        limit_req zone=api burst=20 nodelay;

        # CORS for the demo
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # WebSocket for live metrics
    location /ws {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8765/health;
    }

    # Grafana dashboard (optional)
    location /grafana/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
    }
}

# Rate limiting zone
geo $limit {
    default 1;
    127.0.0.1 0;
}

map $limit $limit_key {
    0 "";
    1 $binary_remote_addr;
}

limit_req_zone $limit_key zone=api:10m rate=10r/s;
