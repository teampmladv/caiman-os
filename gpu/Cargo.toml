[package]
name        = "caiman-gpu"
version     = "0.1.0"
edition     = "2021"
description = "Caimán OS — gpu subsystem"
license     = "Apache-2.0"

[[bin]]
name = "caiman-gpu"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
