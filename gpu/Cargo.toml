[package]
name        = "caiman-gpu"
version     = "1.0.0"
edition     = "2021"
description = "Caimán OS — GPU passthrough, MIG, and vGPU management"
license     = "Apache-2.0"

[[bin]]
name = "caiman-gpu"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1", features = ["full"] }
axum         = { version = "0.7", features = ["macros"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
uuid         = { version = "1", features = ["v4"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
