---
# GPU Device Plugin + RuntimeClass + example VM pod with GPU
# Handles: full passthrough, MIG slices, vGPU profiles

# ── RuntimeClass for GPU VMs ───────────────────────────────────────────────
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: caiman-gpu
handler: caiman
scheduling:
  nodeSelector:
    caiman.io/gpu: "enabled"
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"

---
# ── GPU resource CRD ───────────────────────────────────────────────────────
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vmgpuallocations.caiman.io
spec:
  group: caiman.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                vmId:      { type: integer }
                mode:
                  type: string
                  enum: [passthrough, mig, vgpu]
                profile:   { type: string }
                gpuUuid:   { type: string }
            status:
              type: object
              properties:
                state:     { type: string }
                vfioDevice: { type: string }
                allocatedAt: { type: string }
  scope: Namespaced
  names:
    plural: vmgpuallocations
    singular: vmgpuallocation
    kind: VmGpuAllocation
    shortNames: [vga]

---
# ── GPU device plugin DaemonSet ────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: caiman-gpu-plugin
  namespace: caiman-system
spec:
  selector:
    matchLabels:
      app: caiman-gpu-plugin
  template:
    metadata:
      labels:
        app: caiman-gpu-plugin
    spec:
      nodeSelector:
        caiman.io/gpu: "enabled"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: gpu-plugin
          image: ghcr.io/your-org/caiman-gpu:latest
          args: ["device-plugin"]
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: nvidia-mods
              mountPath: /usr/lib/modules
              readOnly: true
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: dev
          hostPath: { path: /dev }
        - name: sys
          hostPath: { path: /sys }
        - name: device-plugins
          hostPath: { path: /var/lib/kubelet/device-plugins }
        - name: nvidia-mods
          hostPath: { path: /usr/lib/modules }

---
# ── Example: VM pod with MIG A100 3g.40gb slice ────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: vm-ml-training
  namespace: default
  annotations:
    gpu.caiman.io/mode: "mig"
    gpu.caiman.io/profile: "3g.40gb"
    k8s.v1.cni.cncf.io/networks: caiman-standalone
spec:
  runtimeClassName: caiman-gpu
  nodeSelector:
    caiman.io/gpu: "enabled"
    nvidia.com/mig.capable: "true"
  containers:
    - name: vm
      image: ghcr.io/your-org/caiman-vmm:latest
      resources:
        requests:
          cpu: "8"
          memory: "64Gi"
          caiman.io/mig-3g.40gb: "1"
        limits:
          cpu: "16"
          memory: "64Gi"
          caiman.io/mig-3g.40gb: "1"
      securityContext:
        privileged: true

---
# ── Example: VM pod with full GPU passthrough ──────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: vm-gpu-passthrough
  namespace: default
  annotations:
    gpu.caiman.io/mode: "passthrough"
spec:
  runtimeClassName: caiman-gpu
  nodeSelector:
    caiman.io/gpu: "enabled"
  containers:
    - name: vm
      image: ghcr.io/your-org/caiman-vmm:latest
      resources:
        requests:
          cpu: "16"
          memory: "128Gi"
          caiman.io/gpu-passthrough: "1"
        limits:
          cpu: "32"
          memory: "128Gi"
          caiman.io/gpu-passthrough: "1"
      securityContext:
        privileged: true
