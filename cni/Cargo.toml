[package]
name        = "caiman-cni"
version     = "0.1.0"
edition     = "2021"
description = "caiman CNI plugin — compatible with Calico, Cilium, Flannel, Antrea, SR-IOV, Weave"
license     = "Apache-2.0"

[[bin]]
name = "caiman-cni"
path = "src/main.rs"

[features]
default  = ["calico", "cilium", "flannel", "antrea", "sriov", "weave"]
calico   = []
cilium   = []
flannel  = []
antrea   = ["dep:ovsdb"]
sriov    = []
weave    = []

[dependencies]
# ── CNI spec types ────────────────────────────────────────────────────────────
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Netlink: create tap/veth, rtnetlink ───────────────────────────────────────
rtnetlink    = "0.14"
netlink-sys  = "0.8"
futures      = "0.3"

# ── eBPF map access (BPF maps for XDP + Cilium coexistence) ───────────────────
libbpf-rs    = "0.24"

# ── Process spawning (delegate IPAM, chain plugins) ───────────────────────────
tokio-process = "0.2"

# ── HTTP client (Calico API, Antrea controller) ───────────────────────────────
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ── OVSDB (Antrea / OVS) ──────────────────────────────────────────────────────
ovsdb = { version = "0.2", optional = true }

# ── Unix domain sockets (Cilium agent, CNI delegation) ────────────────────────
tokio-unix-ipc = "0.3"

# ── Network address handling ──────────────────────────────────────────────────
ipnet   = "2"
macaddr = "1"

# ── Error handling ────────────────────────────────────────────────────────────
anyhow    = "1"
thiserror = "1"

# ── Logging ───────────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Utilities ─────────────────────────────────────────────────────────────────
uuid  = { version = "1", features = ["v4"] }
hex   = "0.4"
