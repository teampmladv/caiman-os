---
# NetworkAttachmentDefinition examples for Multus
# Deploy: kubectl apply -f network-attachment-definitions.yaml

# ── 1. caiman standalone (no overlay CNI) ──────────────────────────────
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: caiman-standalone
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/resourceName: ""
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "caiman-standalone",
      "type": "caiman-cni",
      "uplink": "eth0",
      "bpfPinPath": "/sys/fs/bpf/caiman",
      "ipam": {
        "type": "host-local",
        "subnet": "10.244.0.0/16",
        "routes": [{ "dst": "0.0.0.0/0" }]
      }
    }

---
# ── 2. caiman + Calico IPAM ────────────────────────────────────────────
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: caiman-calico
  namespace: default
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "caiman-calico",
      "type": "caiman-cni",
      "adapter": "calico",
      "uplink": "eth0",
      "bpfPinPath": "/sys/fs/bpf/caiman",
      "ipam": {
        "type": "calico-ipam",
        "assign_ipv4": "true",
        "ipv4_pools": ["default-ipv4-ippool"]
      }
    }

---
# ── 3. caiman + Cilium (TC fallback mode) ──────────────────────────────
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: caiman-cilium
  namespace: default
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "caiman-cilium",
      "type": "caiman-cni",
      "adapter": "cilium",
      "uplink": "eth0",
      "bpfPinPath": "/sys/fs/bpf/caiman",
      "ipam": {
        "type": "cilium-cni"
      }
    }

---
# ── 4. caiman + Flannel (VXLAN overlay) ────────────────────────────────
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: caiman-flannel
  namespace: default
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "caiman-flannel",
      "type": "caiman-cni",
      "adapter": "flannel",
      "uplink": "eth0",
      "bpfPinPath": "/sys/fs/bpf/caiman",
      "ipam": {
        "type": "flannel",
        "subnetFile": "/run/flannel/subnet.env",
        "dataDir": "/var/lib/cni/flannel"
      }
    }

---
# ── 5. caiman + Antrea (OVS) ───────────────────────────────────────────
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: caiman-antrea
  namespace: default
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "caiman-antrea",
      "type": "caiman-cni",
      "adapter": "antrea",
      "uplink": "eth0",
      "bpfPinPath": "/sys/fs/bpf/caiman",
      "ipam": {
        "type": "host-local",
        "subnet": "10.10.0.0/16"
      }
    }

---
# ── 6. caiman + SR-IOV (hardware passthrough) ──────────────────────────
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: caiman-sriov
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/resourceName: intel.com/intel_sriov_netdevice
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "caiman-sriov",
      "type": "caiman-cni",
      "adapter": "sriov",
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.100.0/24"
      }
    }

---
# ── 7. caiman + Weave ──────────────────────────────────────────────────
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: caiman-weave
  namespace: default
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "caiman-weave",
      "type": "caiman-cni",
      "adapter": "weave",
      "uplink": "eth0",
      "bpfPinPath": "/sys/fs/bpf/caiman",
      "ipam": {
        "type": "weave-ipam"
      }
    }

---
# ── Example: VM pod using multiple interfaces (Multus) ─────────────────────
# Primary: Calico   Secondary: caiman SR-IOV (for high-perf networking)
apiVersion: v1
kind: Pod
metadata:
  name: vm-multiiface-example
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {
          "name": "caiman-sriov",
          "interface": "eth1",
          "mac": "02:aa:bb:cc:dd:ee"
        },
        {
          "name": "caiman-standalone",
          "interface": "eth2",
          "bandwidth": {
            "ingressRate": 10000000000,
            "egressRate":  10000000000
          }
        }
      ]
spec:
  runtimeClassName: caiman
  nodeSelector:
    caiman.io/xdp: "enabled"
  containers:
    - name: vm
      image: ghcr.io/your-org/caiman-vmm:latest
      resources:
        requests:
          cpu: "2"
          memory: "512Mi"
          intel.com/intel_sriov_netdevice: "1"
        limits:
          cpu: "4"
          memory: "2Gi"
          intel.com/intel_sriov_netdevice: "1"
      securityContext:
        privileged: true
