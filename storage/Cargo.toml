[package]
name        = "caiman-storage"
version     = "0.9.0"
edition     = "2021"
description = "Caimán OS — VSAN distributed storage + vVols SAN/NAS"
license     = "Apache-2.0"

[[bin]]
name = "caiman-storage"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1", features = ["full"] }
axum         = { version = "0.7", features = ["macros"] }
tower-http   = { version = "0.5", features = ["cors"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
thiserror    = "1"
uuid         = { version = "1", features = ["v4", "serde"] }
chrono       = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
futures      = "0.3"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
