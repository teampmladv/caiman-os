[package]
name        = "caiman-livemig"
version     = "1.0.0"
edition     = "2021"
description = "Caimán OS — live migration (pre-copy, < 200ms blackout)"
license     = "Apache-2.0"

[[bin]]
name = "caiman-livemig"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
clap         = { version = "4", features = ["derive"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc         = "0.2"
reqwest      = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
