---
# MicroSegPolicy CRD definition
# caiman micro-segmentation: zero-trust, eBPF-enforced at XDP layer
# Enforced before any routing — packets are dropped at wire speed (~5µs)

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: microsegpolicies.caiman.io
spec:
  group: caiman.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [action, from, to]
              properties:
                priority:
                  type: integer
                  minimum: 0
                  maximum: 255
                  default: 100
                  description: "Lower number = higher priority (evaluated first)"
                action:
                  type: string
                  enum: [ALLOW, DENY, LOG]
                  description: "ALLOW: permit + redirect. DENY: XDP_DROP. LOG: allow + audit event."
                from:
                  type: array
                  items:
                    type: object
                    properties:
                      matchLabels:
                        type: object
                        additionalProperties:
                          type: string
                to:
                  type: array
                  items:
                    type: object
                    properties:
                      matchLabels:
                        type: object
                        additionalProperties:
                          type: string
                ports:
                  type: array
                  items:
                    type: object
                    properties:
                      protocol:
                        type: string
                        enum: [TCP, UDP, ICMP]
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
  scope: Namespaced
  names:
    plural: microsegpolicies
    singular: microsegpolicy
    kind: MicroSegPolicy
    shortNames: [msp]

---
# ── Example policies: 3-tier web application ──────────────────────────────

# 1. Default deny-all (applied first due to priority=255)
#    All VM-to-VM traffic is blocked unless explicitly allowed.
apiVersion: caiman.io/v1alpha1
kind: MicroSegPolicy
metadata:
  name: default-deny-all
  namespace: production
spec:
  priority: 255
  action: DENY
  from:
    - matchLabels:
        caiman.io/managed: "true"
  to:
    - matchLabels:
        caiman.io/managed: "true"

---
# 2. Allow web tier → app tier on port 8080
apiVersion: caiman.io/v1alpha1
kind: MicroSegPolicy
metadata:
  name: web-to-app
  namespace: production
spec:
  priority: 10
  action: ALLOW
  from:
    - matchLabels:
        app: web
        env: production
  to:
    - matchLabels:
        app: backend
        env: production
  ports:
    - protocol: TCP
      port: 8080

---
# 3. Allow app tier → database on port 5432
apiVersion: caiman.io/v1alpha1
kind: MicroSegPolicy
metadata:
  name: app-to-db
  namespace: production
spec:
  priority: 10
  action: ALLOW
  from:
    - matchLabels:
        app: backend
        env: production
  to:
    - matchLabels:
        app: postgres
        env: production
  ports:
    - protocol: TCP
      port: 5432

---
# 4. Block all lateral movement between app VMs (same tier)
apiVersion: caiman.io/v1alpha1
kind: MicroSegPolicy
metadata:
  name: no-lateral-app
  namespace: production
spec:
  priority: 5
  action: DENY
  from:
    - matchLabels:
        app: backend
  to:
    - matchLabels:
        app: backend

---
# 5. Log suspicious cross-env traffic (audit without dropping)
apiVersion: caiman.io/v1alpha1
kind: MicroSegPolicy
metadata:
  name: audit-cross-env
  namespace: production
spec:
  priority: 20
  action: LOG
  from:
    - matchLabels:
        env: production
  to:
    - matchLabels:
        env: staging

---
# ── micro-segmentation DaemonSet ──────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: caiman-microseg
  namespace: caiman-system
spec:
  selector:
    matchLabels:
      app: caiman-microseg
  template:
    metadata:
      labels:
        app: caiman-microseg
    spec:
      hostNetwork: true
      nodeSelector:
        caiman.io/xdp: "enabled"
      tolerations:
        - operator: Exists
      serviceAccountName: caiman-microseg
      priorityClassName: system-node-critical
      containers:
        - name: microseg
          image: ghcr.io/your-org/caiman-microseg:latest
          args:
            - run
            - --bpf-pin-path=/sys/fs/bpf/caiman-microseg
            - --uplink=eth0
          securityContext:
            privileged: true
            capabilities:
              add: [NET_ADMIN, SYS_ADMIN, BPF]
          volumeMounts:
            - name: bpf-fs
              mountPath: /sys/fs/bpf
            - name: ebpf-obj
              mountPath: /usr/local/lib/caiman
              readOnly: true
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits:   { cpu: "500m", memory: "128Mi" }
      volumes:
        - name: bpf-fs
          hostPath: { path: /sys/fs/bpf, type: Directory }
        - name: ebpf-obj
          hostPath: { path: /usr/local/lib/caiman, type: Directory }

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: caiman-microseg
rules:
  - apiGroups: ["caiman.io"]
    resources: ["microsegpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
