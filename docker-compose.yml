# ═══════════════════════════════════════════════════════════════════════════
#  Caimán OS — Production stack
#  Usage: docker-compose up -d
#  Dashboard: http://<host>:3000
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── Core API ─────────────────────────────────────────────────────────────
  caiman-api:
    image: ghcr.io/teampmladv/caiman-api:0.7.0
    container_name: caiman-api
    restart: unless-stopped
    network_mode: host          # needs host network for spawning VMs
    pid: host                   # needs host PID namespace for kill()
    privileged: true            # needs /dev/kvm + /var/run/caiman
    environment:
      RUST_LOG: caiman_api=info
    volumes:
      - /var/run/caiman:/var/run/caiman    # VM state files
      - /var/lib/caiman:/var/lib/caiman    # disk images
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Dashboard ─────────────────────────────────────────────────────────────
  caiman-ui:
    image: ghcr.io/teampmladv/caiman-ui:0.7.0
    container_name: caiman-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8765
    depends_on:
      caiman-api:
        condition: service_healthy

  # ── DRS scheduler ────────────────────────────────────────────────────────
  caiman-drs:
    image: ghcr.io/teampmladv/caiman-drs:0.7.0
    container_name: caiman-drs
    restart: unless-stopped
    network_mode: host
    environment:
      RUST_LOG:                      caiman_drs=info
      CAIMAN_DRS__API_URL:           http://localhost:8765
      CAIMAN_DRS__MODE:              FullyAutomated
      CAIMAN_DRS__IMBALANCE_THRESHOLD: "0.10"
      CAIMAN_DRS__MONITOR_INTERVAL_SECS: "30"
    depends_on:
      caiman-api:
        condition: service_healthy

  # ── Backup, Templates & Snapshots ─────────────────────────────────────────
  caiman-bts:
    image: ghcr.io/teampmladv/caiman-bts:0.7.0
    container_name: caiman-bts
    restart: unless-stopped
    network_mode: host
    environment:
      RUST_LOG: caiman_bts=info
    volumes:
      - /var/lib/caiman:/var/lib/caiman
      - /var/run/caiman:/var/run/caiman

  # ── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: caiman-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d

  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: caiman-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: caiman
      GF_USERS_ALLOW_SIGN_UP:    "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
