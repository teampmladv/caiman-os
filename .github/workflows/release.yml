name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ── Build binaries ────────────────────────────────────────────────────────
  build:
    name: Build binaries
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + musl
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools \
            libssl-dev pkg-config libsqlite3-dev \
            clang llvm libelf-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: release-${{ hashFiles('**/Cargo.toml') }}

      - name: Build workspace (musl static)
        run: |
          cargo build --release --workspace \
            --target x86_64-unknown-linux-musl \
            2>&1 | tail -20
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Package binaries
        run: |
          mkdir -p dist
          for bin in caiman-vmm caiman-api caiman-cni caiman-drs caiman-bts caiman-mcp caiman-livemig; do
            BIN_PATH="target/x86_64-unknown-linux-musl/release/$bin"
            if [ -f "$BIN_PATH" ]; then
              cp "$BIN_PATH" "dist/${bin}-linux-amd64"
              chmod +x "dist/${bin}-linux-amd64"
              echo "✓ $bin ($(du -sh $BIN_PATH | cut -f1))"
            fi
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Generate changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null \
                 || git rev-list --max-parents=0 HEAD)
          git log --oneline "$PREV"..HEAD \
            --pretty="format:- %s (%h)" \
            > CHANGELOG_THIS_RELEASE.md
          echo "" >> CHANGELOG_THIS_RELEASE.md
          echo "## Images" >> CHANGELOG_THIS_RELEASE.md
          echo "" >> CHANGELOG_THIS_RELEASE.md
          for img in caiman-vmm caiman-api caiman-cni caiman-drs caiman-bts caiman-mcp caiman-ui; do
            echo "- \`ghcr.io/teampmladv/${img}:${GITHUB_REF_NAME#v}\`" >> CHANGELOG_THIS_RELEASE.md
          done
          cat CHANGELOG_THIS_RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Caimán OS ${{ github.ref_name }}"
          body_path: CHANGELOG_THIS_RELEASE.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/caiman-*-linux-amd64
            dist/SHA256SUMS
