name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  # ── Build static binaries ─────────────────────────────────────────────────
  build:
    name: Build binaries
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + musl
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools \
            libssl-dev pkg-config libsqlite3-dev \
            clang llvm libelf-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: release-${{ hashFiles('**/Cargo.toml') }}

      - name: Build workspace
        run: |
          cargo build --release --workspace \
            --target x86_64-unknown-linux-musl
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Package binaries
        run: |
          mkdir -p dist
          for bin in caiman-vmm caiman-api caiman-cni caiman-drs caiman-bts \
                     caiman-mcp caiman-livemig caiman-gpu caiman-storage caiman; do
            BIN_PATH="target/x86_64-unknown-linux-musl/release/$bin"
            if [ -f "$BIN_PATH" ]; then
              OUT="dist/${bin}-linux-amd64"
              cp "$BIN_PATH" "$OUT"
              chmod +x "$OUT"
              echo "✓ $bin  $(du -sh $OUT | cut -f1)"
            fi
          done
          cd dist && sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Build release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null \
                 || git rev-list --max-parents=0 HEAD)

          cat > RELEASE_NOTES.md << NOTES
          # 🐊 Caimán OS ${GITHUB_REF_NAME}

          **Open-source hyperconverged infrastructure without QEMU.**
          Named after the Cuban crocodile. Built for the cloud.

          > [Live Demo](https://caimanos.com) · [Documentation](https://github.com/teampmladv/caiman-os/tree/main/docs) · [Install](#install)

          ---

          ## What's new

          $(git log --oneline "$PREV"..HEAD --pretty="format:- %s (%h)")

          ---

          ## Performance

          | Metric | Result | vs. competition |
          |--------|--------|-----------------|
          | Network latency P50 | **8µs** | 12× faster than QEMU/OVS (~100µs) |
          | Live migration | **<200ms** | 5–25× faster than vMotion (1–5s) |
          | VMM memory / VM | **1.8 MB** | 140× smaller than QEMU (250 MB) |
          | Micro-segmentation | **5µs** | 10× faster than NSX-T (~50µs) |
          | License cost | **\$0** | vs. vSphere \$4K–\$10K/socket/yr |

          ---

          ## vs. the market

          | | Caimán OS | VMware vSphere | Nutanix AHV | Proxmox VE |
          |---|:---:|:---:|:---:|:---:|
          | License/yr | **\$0** | \$4K–\$10K/socket | \$8K–\$15K/socket | \$0 |
          | VMM overhead | **1.8 MB** | ~250 MB | ~200 MB | ~250 MB |
          | Network latency | **8µs** | ~100µs | ~80µs | ~100µs |
          | Live migration | **<200ms** | 1–5s | 1–3s | 2–10s |
          | HCI (storage+net) | **Built-in** | vSAN (+\$\$\$) | DSF (bundled) | Ceph (separate) |
          | Open source | **Apache 2.0** | Proprietary | Proprietary | AGPL |
          | GPU (MIG + vGPU) | **Yes** | Partial | Partial | VFIO only |

          ---

          ## Install

          ```bash
          curl -fsSL https://caimanos.com/install.sh | sudo bash
          ```

          Or with Docker Compose:

          ```bash
          git clone https://github.com/teampmladv/caiman-os
          cd caiman-os && docker compose up -d
          ```

          ---

          ## OCI images

          ```
          ghcr.io/teampmladv/caiman-api:${VERSION}       # 2.2 MB
          ghcr.io/teampmladv/caiman-vmm:${VERSION}       # 1.8 MB
          ghcr.io/teampmladv/caiman-storage:${VERSION}   # 1.4 MB
          ghcr.io/teampmladv/caiman-drs:${VERSION}       # 4.5 MB
          ghcr.io/teampmladv/caiman-gpu:${VERSION}       # 1.2 MB
          ghcr.io/teampmladv/caiman-ui:${VERSION}        # 552 KB
          ghcr.io/teampmladv/caiman-mcp:${VERSION}       # 1.1 MB
          ghcr.io/teampmladv/caiman-cni:${VERSION}       # 1.1 MB
          ghcr.io/teampmladv/caiman-bts:${VERSION}       # 332 KB
          ```

          ---

          ## Components in this release

          | Binary | Size | Description |
          |--------|------|-------------|
          | \`caiman-vmm-linux-amd64\` | 1.8 MB | KVM VMM — no QEMU, direct ioctls |
          | \`caiman-api-linux-amd64\` | 2.2 MB | REST API + WebSocket |
          | \`caiman-storage-linux-amd64\` | 1.4 MB | VSAN + vVols storage daemon |
          | \`caiman-drs-linux-amd64\` | 4.5 MB | Distributed Resource Scheduler |
          | \`caiman-gpu-linux-amd64\` | 1.2 MB | GPU passthrough + MIG + vGPU |
          | \`caiman-livemig-linux-amd64\` | 980 KB | Live migration |
          | \`caiman-linux-amd64\` | 3.1 MB | CLI (\`caiman vm\`, \`caiman drs\`, ...) |
          | \`caiman-mcp-linux-amd64\` | 1.1 MB | MCP server (AI integration) |
          | \`caiman-cni-linux-amd64\` | 1.1 MB | CNI plugin |
          | \`caiman-bts-linux-amd64\` | 332 KB | Backup + Templates + Snapshots |
          | \`SHA256SUMS\` | — | Checksums for all binaries |

          ---

          **[Full changelog](https://github.com/teampmladv/caiman-os/blob/main/CHANGELOG.md)**
          NOTES

          echo "notes_file=RELEASE_NOTES.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Caimán OS ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/caiman-*-linux-amd64
            dist/SHA256SUMS
