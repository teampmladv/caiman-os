name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust workspace ────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.crate }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: vmm
            pkg: caiman-vmm
          - crate: api
            pkg: caiman-api
          - crate: cni
            pkg: caiman-cni
          - crate: drs
            pkg: caiman-drs
          - crate: bts
            pkg: caiman-bts
          - crate: mcp
            pkg: caiman-mcp
          - crate: livemig
            pkg: caiman-livemig
          - crate: gpu
            pkg: caiman-gpu
          - crate: storage
            pkg: caiman-storage
          - crate: cli
            pkg: caiman

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: rust-${{ matrix.crate }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: rust-${{ matrix.crate }}-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libssl-dev pkg-config libsqlite3-dev libc6-dev

      - name: Build ${{ matrix.crate }}
        run: cargo build --release -p ${{ matrix.pkg }}

      - name: Test ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.pkg }}

  # ── UI ────────────────────────────────────────────────────────────────────
  ui:
    name: UI (React)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: cd ui && npm install

      - name: Build
        run: cd ui && npm run build

  # ── Summary ───────────────────────────────────────────────────────────────
  ci-ok:
    name: CI ✓
    needs: [rust, ui]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Check
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi
          echo "🐊 All CI checks passed"
