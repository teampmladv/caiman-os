[package]
name = "caiman-api"
version     = "0.1.0"
edition     = "2021"
description = "Caimán OS — REST API + WebSocket + Prometheus exporter"
license     = "Apache-2.0"

[[bin]]
name = "caiman-api"
path = "src/main.rs"

[dependencies]
# ── HTTP / WebSocket ──────────────────────────────────────────────────────
axum              = { version = "0.7", features = ["ws", "macros"] }
axum-extra        = { version = "0.9", features = ["typed-header"] }
tower             = { version = "0.4", features = ["full"] }
tower-http        = { version = "0.5", features = ["cors", "trace", "compression-gzip", "request-id"] }
tokio             = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"

# ── Serialization ─────────────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# ── Auth (JWT) ────────────────────────────────────────────────────────────
jsonwebtoken = "9"
bcrypt       = "0.15"

# ── Metrics (Prometheus) ──────────────────────────────────────────────────
prometheus      = { version = "0.13", features = ["process"] }
prometheus-hyper= "0.3"

# ── Netlink (talks to caiman_net.ko) ─────────────────────────────────────
genetlink    = "0.3"
netlink-sys  = "0.8"
netlink-proto= "0.11"

# ── eBPF map access (XDP stats) ───────────────────────────────────────────
libbpf-rs    = "0.24"

# ── Kubernetes client (nodes, pods, events) ───────────────────────────────
kube    = { version = "0.89", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.22", features = ["v1_29"] }

# ── System metrics (/proc, /sys) ──────────────────────────────────────────
sysinfo   = "0.30"
procfs    = "0.16"

# ── Database (SQLite for audit log + state) ───────────────────────────────
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "migrate", "chrono"] }

# ── Cache (in-memory) ─────────────────────────────────────────────────────
moka = { version = "0.12", features = ["future"] }

# ── Error handling ────────────────────────────────────────────────────────
anyhow    = "1"
thiserror = "1"

# ── Config ────────────────────────────────────────────────────────────────
config    = "0.14"
dotenvy   = "0.15"

# ── Logging / tracing ─────────────────────────────────────────────────────
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender     = "0.2"

# ── Utilities ─────────────────────────────────────────────────────────────
uuid    = { version = "1", features = ["v4"] }
chrono  = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
