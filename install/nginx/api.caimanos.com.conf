# /etc/nginx/sites-available/api.caimanos.com
# SSL reverse proxy to caiman-api on the KVM server
# Run: certbot --nginx -d api.caimanos.com

server {
    listen 80;
    server_name api.caimanos.com;
    return 301 https://api.caimanos.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.caimanos.com;

    ssl_certificate     /etc/letsencrypt/live/api.caimanos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.caimanos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Allow requests from Railway frontend
    set $cors_origin "";
    if ($http_origin ~* "^https://(caimanos\.com|.*\.railway\.app)$") {
        set $cors_origin $http_origin;
    }

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Max-Age       3600 always;

    if ($request_method = OPTIONS) { return 204; }

    location / {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # WebSocket for live metrics
    location /ws {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
