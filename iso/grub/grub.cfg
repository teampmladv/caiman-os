set default=0
set timeout=5
set timeout_style=menu
insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm
set color_normal=light-green/black
set color_highlight=black/light-green

menuentry "🐊 Install Caiman OS 1.2.0" --class caiman {
    linux  /boot/vmlinuz quiet console=ttyS0,115200 \
           caiman.mode=install caiman.version=1.2.0
    initrd /boot/initramfs.img
}
menuentry "🐊 Caiman OS -- Live (no install)" --class caiman {
    linux  /boot/vmlinuz quiet console=ttyS0,115200 \
           caiman.mode=live caiman.version=1.2.0
    initrd /boot/initramfs.img
}
menuentry "🐊 Caiman OS -- Safe mode" --class caiman {
    linux  /boot/vmlinuz console=ttyS0,115200 \
           caiman.mode=live caiman.safe=1
    initrd /boot/initramfs.img
}
menuentry "🐊 Caiman OS -- Debug" --class caiman {
    linux  /boot/vmlinuz console=ttyS0,115200 \
           caiman.mode=install caiman.debug=1
    initrd /boot/initramfs.img
}
menuentry "Boot from local disk" {
    chainloader +1
}
